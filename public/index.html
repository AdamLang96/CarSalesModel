<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Sale Value</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; }
        .header-section { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 2rem 0; margin-bottom: 2rem; }
        .nav-tabs { border-bottom: none; }
        .nav-tabs .nav-link { border: none; padding: 12px 24px; color: #495057; font-weight: 500; }
        .nav-tabs .nav-link.active { background-color: #0099ff; color: white; border-radius: 8px; }
        .nav-tabs .nav-link:hover { color: #0099ff; }
        .form-card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 2rem; margin-bottom: 1rem; }
        .submit-btn { background-color: #0099ff; color: white; border: none; padding: 12px 32px; border-radius: 8px; font-weight: 600; width: 100%; transition: all 0.3s; }
        .submit-btn:hover { background-color: #00008B; }
        .result-card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 2rem; margin-top: 2rem; }
        .price-display { font-size: 2.5rem; font-weight: 700; color: #28a745; }
        .feature-importance { margin-top: 1.5rem; }
        .faq-item { background: white; border-radius: 8px; margin-bottom: 1rem; padding: 1rem; }
        .api-table { background: white; border-radius: 8px; overflow: hidden; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="src/App.jsx"></script>
</body>
</html>
